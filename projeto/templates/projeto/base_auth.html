{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}SiFTec · Login{% endblock %}</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Mesmo tema do sistema -->
  <link rel="stylesheet" href="{% static 'projeto/css/siftec.css' %}">

  <style>
    /* Centraliza o card no meio */
    .auth-wrap{
      min-height: calc(100vh - 62px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 22px 16px;
    }
    .auth-card{
      width: min(440px, 100%);
      border-radius: 18px;
      overflow: hidden;

      background: rgba(36, 164, 187, 0.377);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border: 1px solid rgba(255,255,255,.35);
      box-shadow: 0 18px 46px rgba(15, 23, 42, .18);
    }
    .auth-head{
      padding: 18px 18px 0;
      text-align:center;
    }
    .auth-head img{
      width: 86px; height: 86px;
      object-fit: contain;
      margin: 6px auto 10px;
      display:block;
    }
    .auth-sub{
      color: rgba(15,23,42,.65);
      font-weight: 600;
      font-size: 14px;
      margin-top: 4px;
    }
  </style>

  {% block head %}{% endblock %}
</head>

<body>

  <!-- Topbar igual ao sistema -->
  <div class="topbar">
    <div class="brand">
      <img src="{% static 'projeto/img/logo3.png' %}" alt="SiFTec">
      <div>
        <div>SiFTec</div>
        <div style="font-size:12px; opacity:.9; font-weight:600;"> Sistema de Fiscalização Técnica </div>
      </div>
    </div>

    <div class="ms-auto text-white-50 small d-none d-sm-block">
      Acesso restrito
    </div>
  </div>

  <div class="auth-wrap">
    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
